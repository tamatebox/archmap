[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tamatebox/archmap"
# The highest any dependency needs: Ruff's parser crates.
rust-version = "1.97"

[workspace.dependencies]
archmap-core = { path = "crates/archmap-core", version = "0.1.0" }
archmap-scan = { path = "crates/archmap-scan", version = "0.1.0" }
archmap-app = { path = "crates/archmap-app", version = "0.1.0" }
archmap-mcp = { path = "crates/archmap-mcp", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
json-strip-comments = "3.1.2"
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_parser = { version = "0.152.0", default-features = false }
oxc_resolver = "11.24.3"
oxc_semantic = "0.152.0"
oxc_span = "0.152.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# Published as an internal component of Ruff, whose API may change from one
# version to the next: pinned exactly, and used only in `python/uses.rs`.
ruff_python_ast = "=0.0.16"
ruff_python_parser = "=0.0.16"
ruff_text_size = "=0.0.16"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
toml = "0.8"
yaml-rust2 = { version = "0.13", default-features = false }

[workspace.lints.clippy]
all = "warn"
